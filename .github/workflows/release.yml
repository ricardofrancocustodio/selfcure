name: Release to npm

# Publishes all 9 @selfcure/* packages via npm Trusted Publishing (OIDC) —
# no NPM_TOKEN. Triggered by pushing a version tag (created by
# `npm run release <bump> --prepare` + `git push --follow-tags`).
#
# One-time setup per package on npmjs.com → Settings → Trusted Publisher:
#   Provider: GitHub Actions
#   Repository: ricardofrancocustodio/selfcure
#   Workflow:   release.yml
# See docs/releasing.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing + provenance need npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/cli/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      - name: Publish in dependency order (OIDC + provenance)
        run: |
          set -e
          for p in crawler analyzer generator runner selfcure reporter web mcp cli; do
            echo "::group::publish @selfcure/$p"
            npm publish -w "@selfcure/$p" --provenance --access public
            echo "::endgroup::"
          done
